name: Mantener la app despierta

on:
  schedule:
    - cron: "17 */6 * * *"   # cada 6 horas
  workflow_dispatch: {}      # tambien se puede correr a mano desde la pestaña Actions

permissions:
  contents: read

jobs:
  visitar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python .github/keepalive.py
        env:
          APP_URL: ${{ vars.APP_URL }}
